name: iOS alpha
# iOS publishing is paused at the user's request. Manual builds retain CI artifacts only.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-alpha-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      COPYFILE_DISABLE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build and validate iOS 27 alpha
        run: python3 scripts/build_ios.py --output "$RUNNER_TEMP/ios-alpha"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: yingxi-ios-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ios-alpha/*.ipa
            ${{ runner.temp }}/ios-alpha/*.zip
            ${{ runner.temp }}/ios-alpha/*.log
            ${{ runner.temp }}/ios-alpha/*.json
            ${{ runner.temp }}/ios-alpha/*.png
            ${{ runner.temp }}/ios-alpha/IOS-SHA256SUMS
            ${{ runner.temp }}/ios-alpha/release-notes.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  publish:
    if: ${{ false }} # Publishing paused; do not enable without the user's request.
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Download verified build and publish unsigned alpha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "yingxi-ios-$GITHUB_SHA" --dir "$RUNNER_TEMP/ios-alpha"
          python3 scripts/publish_ios.py --output "$RUNNER_TEMP/ios-alpha"
