name: iOS alpha
on:
  push:
    branches: [main, dev_ios_alpha, dev_aliyun_integration]
    paths: ['ios/**', 'scripts/build_ios.py', 'scripts/publish_ios.py', '.github/workflows/ios-alpha.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-alpha-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      COPYFILE_DISABLE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build and validate iOS 27 alpha
        run: python3 scripts/build_ios.py --output "$RUNNER_TEMP/ios-alpha"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: yingxi-ios-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ios-alpha/*.ipa
            ${{ runner.temp }}/ios-alpha/*.zip
            ${{ runner.temp }}/ios-alpha/*.json
            ${{ runner.temp }}/ios-alpha/*.png
            ${{ runner.temp }}/ios-alpha/IOS-SHA256SUMS
            ${{ runner.temp }}/ios-alpha/release-notes.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Download verified build and publish unsigned alpha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "yingxi-ios-$GITHUB_SHA" --dir "$RUNNER_TEMP/ios-alpha"
          python3 scripts/publish_ios.py --output "$RUNNER_TEMP/ios-alpha"
