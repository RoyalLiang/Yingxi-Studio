name: Signed release
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['version.json']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, matching version.json
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: yingxi-release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
      ref: ${{ steps.candidate.outputs.ref }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      COPYFILE_DISABLE: '1'
      REQUESTED_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      ALLOW_CREATE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve version, bilingual notes and immutable source
        id: candidate
        shell: bash
        run: |
          args=(plan --tag "$REQUESTED_TAG")
          if [ "$ALLOW_CREATE" = "true" ]; then args+=(--allow-create-tag); fi
          python3 scripts/release_automation.py "${args[@]}"
  verify:
    needs: plan
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.ref }}
    permissions:
      contents: read
  release:
    needs: [plan, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      PYTHONDONTWRITEBYTECODE: '1'
      COPYFILE_DISABLE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Version and source
        run: |
          python3 scripts/repository_guard.py --git
          python3 scripts/versioning.py --tag "$TAG"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          cache-disabled: true
      - name: Android SDK
        run: |
          sdk_manager="${ANDROID_HOME:?Runner Android SDK location is missing}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdk_manager"
          "$sdk_manager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Import signing material outside checkout
        env:
          STORE_BASE64: ${{ secrets.YINGXI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.YINGXI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YINGXI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.YINGXI_KEY_PASSWORD }}
        run: |
          test -n "$STORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Configure the four release environment signing secrets first'; exit 1; }
          umask 077
          printf '%s' "$STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yingxi-release.keystore"
      - name: Build signed APK
        env:
          PLAYER_BUILD_DIR: ${{ runner.temp }}/yingxi-release-build
          YINGXI_KEYSTORE_PATH: ${{ runner.temp }}/yingxi-release.keystore
          YINGXI_KEYSTORE_PASSWORD: ${{ secrets.YINGXI_KEYSTORE_PASSWORD }}
          YINGXI_KEY_ALIAS: ${{ secrets.YINGXI_KEY_ALIAS }}
          YINGXI_KEY_PASSWORD: ${{ secrets.YINGXI_KEY_PASSWORD }}
        run: python3 scripts/build.py :app:verifyReleaseSigning :app:assembleRelease
      - name: Ensure immutable version tag after successful checks and build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_automation.py ensure-tag --tag "$TAG"
      - name: Verify APK, signer and release assets
        env:
          YINGXI_SIGNER_SHA256: ${{ vars.YINGXI_SIGNER_SHA256 }}
        run: python3 scripts/release_tools.py prepare --tag "$TAG" --output "$RUNNER_TEMP/release-assets"
      - name: Retain CI audit artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: yingxi-release-audit-${{ needs.plan.outputs.tag }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      # Recovery can rebuild an immutable tag with repaired publication tooling.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: release-publisher
          persist-credentials: false
      - name: Publish verified installer from a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release-publisher/scripts/release_tools.py publish --tag "$TAG" --output "$RUNNER_TEMP/release-assets"
      - name: Remove signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/yingxi-release.keystore"
